[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2lm"
version = "0.1.0"
description = "A2LM - a small, genuine, from-scratch language model (trains locally, runs on PC, VPS, Colab, and exports to ESP32)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
a2lm = "a2lm.cli:main"

[tool.setuptools.packages.find]
include = ["a2lm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]